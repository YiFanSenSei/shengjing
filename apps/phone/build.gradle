plugins { id 'com.android.application' }
android {
    namespace 'org.shengjing.phone'
    compileSdk 35
    defaultConfig { applicationId 'org.shengjing.phone'; minSdk 26; targetSdk 35; versionCode 12; versionName '0.10.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += 'tflite' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
}
dependencies {
    implementation project(':engine')
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
}
tasks.named('preBuild').configure {
    doFirst { if (!file('src/main/assets/yamnet.tflite').exists()) throw new GradleException('Run python scripts/bootstrap.py --model before building.') }
}
