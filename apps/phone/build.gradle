plugins { id 'com.android.application' }
android {
    namespace 'org.shengjing.phone'
    compileSdk 35
    defaultConfig { applicationId 'org.shengjing.phone'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.3.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += 'tflite' }
}
dependencies {
    implementation project(':engine')
    implementation 'org.tensorflow:tensorflow-lite-task-audio:0.4.4'
}
tasks.named('preBuild').configure {
    doFirst { if (!file('src/main/assets/yamnet.tflite').exists()) throw new GradleException('Run python scripts/bootstrap.py --model before building.') }
}
