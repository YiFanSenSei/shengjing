name: Audio baseline tooling
on:
  pull_request:
    paths:
      - 'evaluation/**'
      - '.github/workflows/audio-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test audio preprocessing and metric semantics without downloading audio
        run: |
          python3.12 -m venv .venv
          .venv/bin/python --version
          .venv/bin/python -m pip install --only-binary=:all: numpy==2.2.6 scipy==1.16.3
          .venv/bin/python -m unittest discover -s evaluation -p 'test_audio_baseline.py'
      - name: Verify continuous policy replay on a fixed score sequence
        run: |
          mkdir -p tmp/continuous-check
          javac -encoding UTF-8 -d tmp/continuous-check agent/engine/src/main/java/org/shengjing/core/Policy.java evaluation/ContinuousReplay.java
          python3 - <<'PY'
          import subprocess
          scores = "1000\t0.5\t0.1\t0.1\n1250\t0.8\t0.1\t0.1\n21000\t0.8\t0.1\t0.1\n"
          for scene, enhanced, expected in [('HOME','false',[1250,21000]), ('HOME','true',[1000,21000]), ('STUDY','true',[1000])]:
              result = subprocess.run(['java','-cp','tmp/continuous-check','ContinuousReplay',scene,enhanced],input=scores,text=True,capture_output=True,check=True)
              assert [int(line.split()[0]) for line in result.stdout.splitlines()] == expected
          PY
